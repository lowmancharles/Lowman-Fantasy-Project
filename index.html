<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Charles Lowman Fantasy Football Projections</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
  </head>
  <body>
    <main class="card">
      <header class="header">
        <h1>Lowbros Pulstars</h1>
        <p class="subtitle">This is a week by week projection tool to help decide who to start and sit.</p>
      </header>

      <section class="add-player">
        <h2>Add Player</h2>
        <div class="form-row">
          <input type="text" id="nameInput" placeholder="Player name">
          <input type="number" id="pointsInput" placeholder="Points" step="0.1">
          <select id="positionSelect">
            <option value="QB">QB</option>
            <option value="RB">RB</option>
            <option value="WR">WR</option>
            <option value="TE">TE</option>
          </select>
          <button class="button" id="addPlayer">Add Player</button>
        </div>
      </section>

      <section class="lineup">
        <div class="lineup-header">
          <h2>Starting Lineup</h2>
          <button class="button button-secondary" id="loadLineup">Load Lineup</button>
        </div>

        <div class="positions">
          <div class="position">
            <span class="pos-label pos-qb">QB</span>
            <ul class="roster" id="QB"></ul>
          </div>
          <div class="position">
            <span class="pos-label pos-rb">RB</span>
            <ul class="roster" id="RB"></ul>
          </div>
          <div class="position">
            <span class="pos-label pos-wr">WR</span>
            <ul class="roster" id="WR"></ul>
          </div>
          <div class="position">
            <span class="pos-label pos-te">TE</span>
            <ul class="roster" id="TE"></ul>
          </div>
          <div class="position">
            <span class="pos-label pos-flex">FLEX</span>
            <ul class="roster" id="FLEX"></ul>
          </div>
        </div>

        <div class="total">
          <span>Projected Total</span>
          <span class="total-value" id="totalPoints">0</span>
        </div>
      </section>

      <section class="bench-section">
        <h2>Bench</h2>
        <div class="position">
          <span class="pos-label pos-bench">BN</span>
          <ul class="roster" id="bench"></ul>
        </div>
      </section>
    </main>

    <script src="scripts.js"></script>
  </body>
</html>
